[project]
name = "moka"
version = "1.0.0"
description = "Distill KataGo into the Moka 9x9 browser model"
requires-python = ">=3.12,<3.14"
dependencies = ["mlx>=0.30,<0.33", "numpy>=2,<3", "onnxruntime>=1.23,<2"]

[project.optional-dependencies]
teacher = ["packaging>=25,<26", "torch>=2.8,<3"]

[project.scripts]
go-arena = "go_model.arena:main"
go-average = "go_model.average:main"
go-benchmark = "go_model.benchmark:main"
go-collect = "go_model.collect:main"
go-diagnose = "go_model.diagnose:main"
go-export = "go_model.export:main"
go-generate = "go_model.generate:main"
go-outcomes = "go_model.outcomes:main"
go-phase = "go_model.phase:main"
go-policy = "go_model.policy:main"
go-quantize = "go_model.quantization:main"
go-reweight = "go_model.reweight:main"
go-search-generate = "go_model.search_generate:main"
go-search-collect = "go_model.search_collect:main"
go-score = "go_model.score:main"
go-train = "go_model.train:main"
go-value = "go_model.value:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/go_model"]
